name: Bootstrap repository source

on:
  push:
    paths:
      - repository-source.zip
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import audited source archive
        shell: bash
        run: |
          if [ ! -f repository-source.zip ]; then
            echo "Archive already imported; nothing to do."
            exit 0
          fi
          unzip -o repository-source.zip
          rm -f repository-source.zip .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import audited plugin source"
          git push
